<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoidedX // Script Vault</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="shell">
        <header class="top-nav">
            <div class="brand-unit">
                <i class="fa-solid fa-terminal brand-icon"></i>
                <div class="brand-titles">
                    <span class="brand-name">VOIDEDX</span>
                    <span class="brand-tag">protect ur scripts!</span>
                </div>
            </div>
        </header>

        <main class="workspace">
            <aside class="sidebar">
                <div class="panel-group">
                    <label class="panel-label">VAULT TITLE</label>
                    <input type="text" id="script-title" class="input-field" placeholder="Hub / Script Name">
                </div>

                <div class="panel-group">
                    <label class="panel-label">NUH UH</label>
                    <div class="info-box">
                        <i class="fa-solid fa-cloud text-cyan"></i>
                        <p>Powered by a cloud. Scripts never wipe, never expire, and loadstrings stay permanent:3</p>
                    </div>
                </div>

                <div class="panel-group">
                    <label class="panel-label">VAULT PROTECTION</label>
                    <div class="toggle-list">
                        <label class="toggle-row">
                            <span>PROTECTION</span>
                            <input type="checkbox" checked disabled>
                            <span class="switch"></span>
                        </label>
                        <label class="toggle-row">
                            <span>BACKUP DOWNLOAD</span>
                            <input type="checkbox" id="chk-backup" checked>
                            <span class="switch"></span>
                        </label>
                    </div>
                </div>

                <button id="lock-vault-btn" class="btn-primary">
                    <i class="fa-solid fa-lock"></i> Save Vault
                </button>
            </aside>

            <section class="editor-stage">
                <div class="editor-header">
                    <span class="editor-title"><i class="fa-solid fa-code"></i> PASTE YOUR SCRIPT (RAW OR OBFUSCATED)</span>
                </div>
                <textarea id="source-code" placeholder="-- Paste your raw Luau or already-obfuscated script here...&#10;print('VoidedX The goat')" spellcheck="false"></textarea>

                <div id="result-overlay" class="result-panel hidden">
                    <div class="result-content">
                        <h4><i class="fa-solid fa-circle-check text-success"></i> SAVED & PROTECTED FROM SKIDDERS BABYYY!</h4>
                        <div class="url-bar">
                            <input type="text" id="ls-output" readonly>
                            <button id="copy-out-btn" class="btn-accent"><i class="fa-solid fa-copy"></i> COPY LOADSTRING</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
