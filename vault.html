<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoidedX // SECURED</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="shell flex-center">
        <div class="secured-card">
            <div class="shield-badge">
                <i class="fa-solid fa-shield-halved text-cyan"></i>
            </div>
            <h2>SECURED!</h2>
            <p>This script vault is encrypted and protected by <strong>VoidedX Engine</strong>.</p>
            <div class="protection-tags">
                <span><i class="fa-solid fa-lock"></i> Anti-Skid</span>
                <span><i class="fa-solid fa-user-secret"></i> Anti-Spy</span>
                <span><i class="fa-solid fa-bug-slash"></i> Anti-Decompile</span>
            </div>
            <div class="loadstring-box">
                <label>Roblox Executor Loadstring:</label>
                <div class="copy-input">
                    <input type="text" id="loadstring-input" readonly>
                    <button id="copy-ls-btn" class="btn-accent"><i class="fa-solid fa-copy"></i> Copy</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id') || 'vx_protected';
            const loadstringInput = document.getElementById('loadstring-input');
            const copyBtn = document.getElementById('copy-ls-btn');

            const rawUrl = `${window.location.origin}/api/raw?id=${id}`;
            loadstringInput.value = `loadstring(game:HttpGet("${rawUrl}"))()`;

            copyBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(loadstringInput.value);
                copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
                setTimeout(() => copyBtn.innerHTML = '<i class="fa-solid fa-copy"></i> Copy', 2000);
            });
        });
    </script>
</body>
</html>
